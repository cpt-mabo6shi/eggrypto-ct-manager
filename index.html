<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fa"><title>エグリプト CT管理ツール ver.0.6</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="CT管理"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f4f6fb;background:#101827}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:16px 14px 48px}h1{font-size:19px;margin:4px 0 12px}h2{font-size:15px;margin:14px 0 8px}.muted{color:#b8c3d7;font-size:13px}.panel{background:#1b2940;border-radius:14px;padding:14px;margin:12px 0}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}button,input{font:inherit}button{border:0;border-radius:11px;padding:12px 13px;background:#4a7cf2;color:white;font-weight:700;touch-action:manipulation}button.secondary{background:#34465f}button.danger{background:#6e3949}button:disabled{opacity:.4}.ct{height:69px;width:100%;color:#16202b;font-size:28px;border-radius:11px;padding:0;user-select:none;-webkit-user-select:none;touch-action:manipulation}.green{background:#bcebc4}.yellow{background:#ffe28c}.pink{background:#f5b7b7}.empty{background:#364357;color:#8793a6}.ct small{font-size:11px;display:block;line-height:1}.field{width:100%;min-width:0;text-align:center;font-size:22px;background:#f7f9ff;border:2px solid #8899b3;border-radius:10px;padding:12px 0;color:#111}#turn{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.dialog-bg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{width:min(100%,360px);background:#23334d;border-radius:16px;padding:20px}.dialog input{width:100%;font-size:26px;padding:10px;border-radius:8px;border:0;text-align:center}.hint{font-size:12px;color:#b7c7df;line-height:1.5}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px}button#undo,button#next{white-space:nowrap;min-width:82px;padding-left:12px;padding-right:12px}button:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:2px}
/* v0.4: light visual theme; functional JS unchanged */
:root{color:#222;background:#f6f7fa;color-scheme:light}main{max-width:560px;padding:24px 16px 48px}h1{font-size:clamp(21px,5vw,28px);margin:8px 0 12px;line-height:1.4}h2{color:#222}.muted{color:#555}.panel{background:#fff;border:1px solid #dedede;box-shadow:0 2px 12px #11111109;border-radius:16px}.hint{color:#626262;line-height:1.7}button{background:#0789ed;color:white}button.secondary{background:#fff;color:#0789ed;border:1px solid #c7c7c7}button.danger{background:#fff;color:#bb1932;border:1px solid #d8c6cb}button:focus-visible,input:focus-visible{outline:3px solid #0789ed}.field{background:white;border:1px solid #bdbdbd;color:#222}.empty{background:#ebedf0;color:#777}.dialog-bg{background:#0009}.dialog{background:white;color:#222;box-shadow:0 10px 35px #0003}.dialog input{background:#fff;border:1px solid #aaa;color:#222}.ct{color:#1e252b}.ct.empty{color:#777}.ct.defeated{background:#f3f4f6;color:transparent;border:1px solid #d9dde2}#undo,#next{min-width:82px}.site-intro{font-size:14px;color:#555;line-height:1.7;margin:0 0 20px}.site-footer{text-align:center;font-size:12px;color:#888;margin-top:30px;line-height:1.6}
</style></head><body><main><h1>エグリプト CT管理ツール ver.0.6</h1><p class="site-intro">アリーナ用のCT管理ツールです。<br>CTを登録すると、ターン進行に合わせてAS発動までの残りCTを確認できます。</p><section id="setup"><div class="panel"><div class="muted">CTを入力（空欄可）</div><div id="setup-teams"></div></div><div class="actions"><button id="start">対戦開始</button><button class="secondary" id="clear">全消去</button></div></section><section id="battle" class="hidden"><div class="panel"><div class="toolbar"><div><div class="muted">残ターン</div><div id="turn">50</div></div><div class="actions"><button class="secondary" id="undo">戻る</button><button id="next">進む</button></div></div></div><div class="panel"><div id="battle-teams"></div><p class="hint">ASまで・・・緑：2ターン以上／黄：1ターン／赤：発動可能<br>赤をタップ：AS消費／マスを長押し：残りCT変更／ダブルタップ：撃破・解除</p></div><div class="actions"><button class="secondary" id="edit">CT編集</button><button class="secondary" id="new">新しい対戦</button></div></section><p class="hint">入力内容と対戦状態は、この端末のブラウザに自動保存されます。ブラウザのデータを削除すると消える場合があります。</p><footer class="site-footer">cpt.ツールズ｜EGGRYPTO CT Manager ver.0.6</footer></main><div id="overlay" class="dialog-bg hidden"><div class="dialog"><h2 id="dialog-title">残りCTの調整</h2><p class="muted">このマスの現在の残りCTを入力</p><input id="adjust-value" type="number" min="0" max="99" inputmode="numeric"><div class="actions" style="margin-top:16px"><button class="secondary" id="cancel">キャンセル</button><button id="apply">反映</button></div></div></div><script>
const KEY='eggrypto-ct-v01';const blank=()=>Array(15).fill(null);let state={base:blank(),remaining:blank(),turn:50,mode:'setup',history:[],defeated:Array(15).fill(false)};try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.base)&&x.base.length===15&&Array.isArray(x.remaining)&&x.remaining.length===15)state={...state,...x,history:Array.isArray(x.history)?x.history:[],defeated:Array.isArray(x.defeated)&&x.defeated.length===15?x.defeated:Array(15).fill(false)}}catch{};
const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};const snapshot=()=>({base:[...state.base],remaining:[...state.remaining],turn:state.turn,mode:state.mode,defeated:[...state.defeated]});const record=()=>{state.history.push(snapshot());if(state.history.length>300)state.history.shift()};const valid=v=>v===''?null:Math.max(0,Math.min(99,Math.trunc(Number(v)||0)));
function render(){ $('setup').classList.toggle('hidden',state.mode!=='setup');$('battle').classList.toggle('hidden',state.mode!=='battle');$('turn').textContent=state.turn;$('undo').disabled=!state.history.length;$('next').disabled=state.turn===0;let a='',b='';for(let t=0;t<3;t++){a+=`<h2>${t+1}陣</h2><div class="grid">`;b+=`<h2>${t+1}陣</h2><div class="grid">`;for(let j=0;j<5;j++){let i=t*5+j,v=state.remaining[i],dead=state.defeated[i];a+=`<input class="field" type="number" min="0" max="99" inputmode="numeric" data-i="${i}" aria-label="${t+1}陣 ${j+1}体目の基本CT" value="${state.base[i]??''}" placeholder="—">`;b+=`<button class="ct ${dead?'defeated':v===null?'empty':v===0?'pink':v===1?'yellow':'green'}" data-i="${i}" aria-label="${t+1}陣 ${j+1}体目 ${dead?'撃破済み':`残りCT ${v??'未登録'}`}">${dead?'':v??'—'}</button>`}a+='</div>';b+='</div>'}$('setup-teams').innerHTML=a;$('battle-teams').innerHTML=b;save()}
$('setup-teams').addEventListener('input',e=>{if(!e.target.matches('input'))return;let i=+e.target.dataset.i;state.base[i]=valid(e.target.value);save()});$('start').onclick=()=>{state.remaining=[...state.base];state.turn=50;state.history=[];state.defeated=Array(15).fill(false);state.mode='battle';render()};$('clear').onclick=()=>{if(!confirm('登録した基本CTをすべて消去しますか？'))return;state.base=blank();state.remaining=blank();state.defeated=Array(15).fill(false);state.history=[];render()};$('next').onclick=()=>{if(state.turn<=0)return;record();state.turn--;state.remaining=state.remaining.map((v,i)=>v===null||state.defeated[i]?v:Math.max(0,v-1));render()};$('undo').onclick=()=>{let prev=state.history.pop();if(!prev)return;Object.assign(state,prev);render()};$('edit').onclick=()=>{record();state.mode='setup';render()};$('new').onclick=()=>{if(!confirm('新しい対戦を始めますか？ 基本CTは保持します。'))return;state.remaining=[...state.base];state.turn=50;state.history=[];state.defeated=Array(15).fill(false);state.mode='setup';render()};
let pressTimer=null,longPressed=false,activeIndex=null;function adjust(i){if(state.remaining[i]===null||state.defeated[i])return;activeIndex=i;$('adjust-value').value=state.remaining[i];$('dialog-title').textContent=`${Math.floor(i/5)+1}陣・${i%5+1}体目 CT調整`;$('overlay').classList.remove('hidden');$('adjust-value').focus()}
const grid=$('battle-teams');let pendingTap=null,lastTapTime=0,lastTapIndex=-1;
function cancelPendingTap(){if(pendingTap!==null){clearTimeout(pendingTap);pendingTap=null}}
function toggleDefeated(i){record();state.defeated[i]=!state.defeated[i];render()}
grid.addEventListener('pointerdown',e=>{const btn=e.target.closest('.ct');if(!btn)return;longPressed=false;clearTimeout(pressTimer);pressTimer=setTimeout(()=>{longPressed=true;cancelPendingTap();lastTapIndex=-1;adjust(+btn.dataset.i)},550)});
for(const ev of ['pointerup','pointercancel','pointerleave'])grid.addEventListener(ev,()=>clearTimeout(pressTimer));
grid.addEventListener('contextmenu',e=>{const btn=e.target.closest('.ct');if(btn){e.preventDefault();clearTimeout(pressTimer);longPressed=true;cancelPendingTap();lastTapIndex=-1;adjust(+btn.dataset.i)}});
grid.addEventListener('click',e=>{const btn=e.target.closest('.ct');if(!btn||longPressed)return;let i=+btn.dataset.i,now=Date.now();if(i===lastTapIndex&&now-lastTapTime<340){cancelPendingTap();lastTapIndex=-1;toggleDefeated(i);return}cancelPendingTap();lastTapIndex=i;lastTapTime=now;if(!state.defeated[i]&&state.remaining[i]===0){pendingTap=setTimeout(()=>{pendingTap=null;lastTapIndex=-1;if(state.defeated[i]||state.remaining[i]!==0)return;record();state.remaining[i]=state.base[i];render()},340)}});
$('cancel').onclick=()=>{$('overlay').classList.add('hidden');activeIndex=null};$('apply').onclick=()=>{if(activeIndex===null)return;record();state.remaining[activeIndex]=valid($('adjust-value').value)??0;$('overlay').classList.add('hidden');activeIndex=null;render()};render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script></body></html>
